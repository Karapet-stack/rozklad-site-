<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Розклад занять</title>

<style>
:root {
    --bg: #080d18;
    --bg2: #0d1424;
    --card: #121b2d;
    --card2: #172236;
    --card3: #1d2a40;

    --border: rgba(255,255,255,.08);

    --text: #f1f5f9;
    --text2: #cbd5e1;
    --muted: #8997aa;

    --blue: #3b82f6;
    --blue2: #2563eb;

    --green: #22c55e;
    --yellow: #fbbf24;
    --red: #ef4444;
}

* {
    box-sizing: border-box;
}

html {
    background: var(--bg);
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(37,99,235,.22),
            transparent 38%
        ),
        linear-gradient(
            180deg,
            #080d18 0%,
            #0c1423 50%,
            #080d18 100%
        );
}

button {
    font: inherit;
}

.app {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;

    padding:
        18px
        14px
        40px;
}

/* ==============================
   HEADER
============================== */

header {
    padding: 5px 2px 18px;
}

.header-top {
    display: flex;
    align-items: center;
    gap: 13px;
}

.logo {
    width: 50px;
    height: 50px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 16px;

    background:
        linear-gradient(
            145deg,
            #3b82f6,
            #1d4ed8
        );

    box-shadow:
        0 8px 25px rgba(37,99,235,.30);

    font-size: 25px;
}

.title-box {
    min-width: 0;
}

h1 {
    margin: 0;

    font-size: 25px;
    line-height: 1.15;

    font-weight: 750;

    letter-spacing: -.5px;
}

.today-line {
    margin-top: 5px;

    color: var(--muted);

    font-size: 13px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ==============================
   TABS
============================== */

.tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 4px;

    padding: 4px;

    margin-bottom: 12px;

    background: rgba(255,255,255,.045);

    border:
        1px solid
        var(--border);

    border-radius: 15px;
}

.tab {
    border: 0;

    padding: 11px;

    border-radius: 11px;

    background: transparent;

    color: var(--muted);

    cursor: pointer;

    font-size: 14px;
    font-weight: 700;

    transition:
        .18s ease;
}

.tab:hover {
    color: var(--text2);
}

.tab.active {
    color: #fff;

    background:
        linear-gradient(
            135deg,
            #3b82f6,
            #2563eb
        );

    box-shadow:
        0 5px 16px
        rgba(37,99,235,.25);
}

/* ==============================
   NAVIGATION
============================== */

.navigation {
    display: grid;

    grid-template-columns:
        48px
        1fr
        48px;

    gap: 9px;

    margin-bottom: 10px;
}

.nav-btn {
    height: 46px;

    border:
        1px solid
        var(--border);

    border-radius: 13px;

    background: var(--card);

    color: var(--text);

    cursor: pointer;

    font-size: 23px;

    transition:
        .15s ease;
}

.nav-btn:hover {
    background: var(--card2);
}

.nav-btn:active {
    transform: scale(.94);
}

.period-label {
    min-width: 0;

    height: 46px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0 10px;

    border:
        1px solid
        var(--border);

    border-radius: 13px;

    background:
        rgba(255,255,255,.045);

    color: var(--text);

    font-size: 14px;
    font-weight: 700;

    text-align: center;
}

/* ==============================
   TODAY
============================== */

.today-btn {
    width: 100%;

    margin-bottom: 16px;

    padding: 12px;

    border:
        1px solid
        rgba(59,130,246,.25);

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            rgba(59,130,246,.16),
            rgba(37,99,235,.07)
        );

    color: #93c5fd;

    cursor: pointer;

    font-size: 14px;
    font-weight: 700;

    transition: .15s ease;
}

.today-btn:hover {
    background:
        linear-gradient(
            135deg,
            rgba(59,130,246,.24),
            rgba(37,99,235,.12)
        );
}

.today-btn:active {
    transform: scale(.985);
}

/* ==============================
   WEEK BADGE
============================== */

.week-info {
    display: flex;
    justify-content: center;

    min-height: 0;

    margin-bottom: 13px;
}

.week-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;

    padding: 7px 13px;

    border-radius: 999px;

    font-size: 13px;
    font-weight: 700;
}

.week-badge.numerator {
    color: #60a5fa;

    background:
        rgba(59,130,246,.11);

    border:
        1px solid
        rgba(59,130,246,.18);
}

.week-badge.denominator {
    color: #fbbf24;

    background:
        rgba(251,191,36,.09);

    border:
        1px solid
        rgba(251,191,36,.17);
}

/* ==============================
   DAY CARD
============================== */

.day-card {
    margin-bottom: 13px;

    overflow: hidden;

    border:
        1px solid
        var(--border);

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(18,27,45,.98),
            rgba(13,20,34,.98)
        );

    box-shadow:
        0 10px 28px
        rgba(0,0,0,.25);
}

.day-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;

    padding: 14px 15px;

    background:
        rgba(255,255,255,.025);

    border-bottom:
        1px solid
        var(--border);
}

.day-title {
    display: flex;
    align-items: center;

    gap: 10px;

    min-width: 0;
}

.day-icon {
    width: 35px;
    height: 35px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 10px;

    background:
        rgba(59,130,246,.12);

    font-size: 17px;
}

.day-name {
    font-size: 16px;
    font-weight: 750;
}

.day-date {
    margin-top: 2px;

    color: var(--muted);

    font-size: 12px;
}

.current-day {
    color: #60a5fa;

    font-size: 10px;
    font-weight: 800;

    white-space: nowrap;
}

/* ==============================
   LESSONS
============================== */

.lessons {
    padding: 7px;
}

.lesson {
    display: grid;

    grid-template-columns:
        42px
        1fr
        auto;

    align-items: center;

    gap: 10px;

    padding: 11px 8px;

    border-radius: 13px;

    transition: background .15s ease;
}

.lesson:hover {
    background:
        rgba(255,255,255,.035);
}

.lesson-number {
    width: 34px;
    height: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background:
        rgba(255,255,255,.055);

    color: var(--muted);

    font-size: 13px;
    font-weight: 750;
}

.lesson-main {
    min-width: 0;
}

.lesson-subject {
    color: var(--text);

    font-size: 15px;
    line-height: 1.3;

    font-weight: 700;

    overflow-wrap: anywhere;
}

.lesson-meta {
    display: flex;
    flex-wrap: wrap;

    gap: 5px 9px;

    margin-top: 5px;

    color: var(--muted);

    font-size: 12px;
}

.group {
    color: #a5b4fc;
}

.time {
    color: #94a3b8;
}

/* ==============================
   CONDUCTED
============================== */

.conducted {
    width: 30px;
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 50%;

    background:
        rgba(34,197,94,.12);

    border:
        1px solid
        rgba(34,197,94,.22);

    color: #22c55e;

    font-size: 17px;
    font-weight: 800;
}

/* ==============================
   EMPTY
============================== */

.empty {
    padding: 25px 15px;

    text-align: center;

    color: var(--muted);

    font-size: 14px;
}

.empty-icon {
    display: block;

    margin-bottom: 7px;

    font-size: 27px;

    opacity: .7;
}

/* ==============================
   FOOTER
============================== */

.footer {
    padding-top: 14px;

    text-align: center;

    color: #59677b;

    font-size: 11px;
}

/* ==============================
   MOBILE
============================== */

@media (max-width: 380px) {

    .app {
        padding-left: 10px;
        padding-right: 10px;
    }

    h1 {
        font-size: 22px;
    }

    .logo {
        width: 45px;
        height: 45px;
    }

    .lesson {
        grid-template-columns:
            36px
            1fr
            auto;

        gap: 8px;
    }

    .lesson-number {
        width: 31px;
        height: 31px;
    }

    .lesson-subject {
        font-size: 14px;
    }
}

@media (min-width: 700px) {

    .app {
        padding-top: 30px;
    }

    h1 {
        font-size: 28px;
    }
}
</style>
</head>


<body>

<div class="app">

<header>

    <div class="header-top">

        <div class="logo">
            📚
        </div>

        <div class="title-box">

            <h1>
                Розклад занять
            </h1>

            <div
                class="today-line"
                id="todayLine"
            >
                Завантаження...
            </div>

        </div>

    </div>

</header>


<!-- ПЕРЕМИКАЧ РЕЖИМІВ -->

<div class="tabs">

    <button
        class="tab active"
        id="weekTab"
        onclick="setMode('week')"
    >
        📅 Тиждень
    </button>

    <button
        class="tab"
        id="dayTab"
        onclick="setMode('day')"
    >
        📋 День
    </button>

</div>


<!-- НАВІГАЦІЯ -->

<div class="navigation">

    <button
        class="nav-btn"
        onclick="previousPeriod()"
    >
        ‹
    </button>

    <div
        class="period-label"
        id="periodLabel"
    >
        Завантаження...
    </div>

    <button
        class="nav-btn"
        onclick="nextPeriod()"
    >
        ›
    </button>

</div>


<!-- СЬОГОДНІ -->

<button
    class="today-btn"
    onclick="goToday()"
>
    📍 Показати сьогодні
</button>


<!-- ТИЖДЕНЬ -->

<div
    class="week-info"
    id="weekInfo"
></div>


<!-- РОЗКЛАД -->

<main id="content">

    <div class="empty">
        <span class="empty-icon">
            ⏳
        </span>

        Завантаження розкладу...
    </div>

</main>


<div class="footer">
    Розклад занять • Оновлюється автоматично
</div>

</div>


<script>

/* =========================================================
   ГОЛОВНИЙ ОБ'ЄКТ РОЗКЛАДУ
   ВАЖЛИВО:
   schedule.json має структуру SCHEDULE.lessons
========================================================= */

let SCHEDULE = null;

let mode = "week";

let currentDate = new Date();

let currentWeekStart =
    getMonday(currentDate);


/* =========================================================
   ЗАВАНТАЖЕННЯ
========================================================= */

async function loadSchedule() {

    try {

        const response = await fetch(
            "schedule.json?_=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        SCHEDULE =
            await response.json();

        render();

    } catch (error) {

        console.error(
            "Помилка завантаження:",
            error
        );

        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="empty">

                <span class="empty-icon">
                    ⚠️
                </span>

                Не вдалося завантажити розклад

            </div>

        `;
    }
}


/* =========================================================
   ДАТА → YYYY-MM-DD
========================================================= */

function toISO(date) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const d =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


/* =========================================================
   YYYY-MM-DD → DATE
========================================================= */

function parseISO(iso) {

    const parts =
        iso.split("-").map(Number);

    return new Date(
        parts[0],
        parts[1] - 1,
        parts[2]
    );
}


/* =========================================================
   ПОНЕДІЛОК ТИЖНЯ
========================================================= */

function getMonday(date) {

    const d =
        new Date(date);

    const day =
        d.getDay();

    const diff =
        day === 0
            ? -6
            : 1 - day;

    d.setDate(
        d.getDate() + diff
    );

    d.setHours(
        0, 0, 0, 0
    );

    return d;
}


/* =========================================================
   ДОДАТИ ДНІ
========================================================= */

function addDays(date, amount) {

    const d =
        new Date(date);

    d.setDate(
        d.getDate() + amount
    );

    return d;
}


/* =========================================================
   ФОРМАТ ДАТИ
========================================================= */

function formatDate(date) {

    return date.toLocaleDateString(
        "uk-UA",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );
}


function formatShortDate(date) {

    return date.toLocaleDateString(
        "uk-UA",
        {
            day: "2-digit",
            month: "2-digit"
        }
    );
}


/* =========================================================
   СЬОГОДНІ В ШАПЦІ
========================================================= */

function updateTodayLine() {

    const now =
        new Date();

    let text =
        now.toLocaleDateString(
            "uk-UA",
            {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

    text =
        text.charAt(0).toUpperCase() +
        text.slice(1);

    document.getElementById(
        "todayLine"
    ).textContent = text;
}


/* =========================================================
   ОТРИМАТИ ЗАНЯТТЯ
========================================================= */

function getLessonsForDate(date) {

    if (
        !SCHEDULE ||
        !Array.isArray(SCHEDULE.lessons)
    ) {
        return [];
    }

    const iso =
        toISO(date);

    return SCHEDULE.lessons
        .filter(
            item =>
                item.date === iso
        )
        .sort(
            (a, b) =>
                Number(a.lesson || 0) -
                Number(b.lesson || 0)
        );
}


/* =========================================================
   ТИП ТИЖНЯ
========================================================= */

function getWeekInfoForDate(date) {

    if (
        !SCHEDULE ||
        !Array.isArray(SCHEDULE.lessons)
    ) {
        return null;
    }

    const iso =
        toISO(date);

    const item =
        SCHEDULE.lessons.find(
            x =>
                x.date === iso
        );

    if (!item) {
        return null;
    }

    const type =
        String(
            item.week_type || ""
        ).toLowerCase();

    if (
        type.includes("чис") ||
        type.includes("num")
    ) {
        return "numerator";
    }

    if (
        type.includes("знам") ||
        type.includes("den")
    ) {
        return "denominator";
    }

    return null;
}


/* =========================================================
   BADGE ТИЖНЯ
========================================================= */

function weekBadge(type) {

    if (
        type === "numerator"
    ) {

        return `
            <div class="week-badge numerator">
                🔵 Чисельник
            </div>
        `;
    }

    if (
        type === "denominator"
    ) {

        return `
            <div class="week-badge denominator">
                🟡 Знаменник
            </div>
        `;
    }

    return "";
}


/* =========================================================
   ВИЗНАЧЕННЯ ТИПУ ТИЖНЯ
========================================================= */

function getWeekTypeForWeek(
    weekStart
) {

    const days = [];

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        days.push(
            addDays(
                weekStart,
                i
            )
        );
    }

    for (
        const date of days
    ) {

        const type =
            getWeekInfoForDate(
                date
            );

        if (type) {
            return type;
        }
    }

    /*
       Якщо в schedule.json
       немає заняття на жоден
       день тижня, пробуємо
       використати метадані.
    */

    if (
        SCHEDULE &&
        SCHEDULE.today_week_type
    ) {

        const type =
            String(
                SCHEDULE.today_week_type
            ).toLowerCase();

        if (
            type.includes("чис")
        ) {
            return "numerator";
        }

        if (
            type.includes("знам")
        ) {
            return "denominator";
        }
    }

    return null;
}


/* =========================================================
   РЕЖИМ
========================================================= */

function setMode(newMode) {

    mode =
        newMode;

    document
        .getElementById(
            "weekTab"
        )
        .classList.toggle(
            "active",
            mode === "week"
        );

    document
        .getElementById(
            "dayTab"
        )
        .classList.toggle(
            "active",
            mode === "day"
        );

    render();
}


/* =========================================================
   НАЗАД
========================================================= */

function previousPeriod() {

    if (
        mode === "week"
    ) {

        currentWeekStart =
            addDays(
                currentWeekStart,
                -7
            );

    } else {

        currentDate =
            addDays(
                currentDate,
                -1
            );

        currentWeekStart =
            getMonday(
                currentDate
            );
    }

    render();
}


/* =========================================================
   ВПЕРЕД
========================================================= */

function nextPeriod() {

    if (
        mode === "week"
    ) {

        currentWeekStart =
            addDays(
                currentWeekStart,
                7
            );

    } else {

        currentDate =
            addDays(
                currentDate,
                1
            );

        currentWeekStart =
            getMonday(
                currentDate
            );
    }

    render();
}


/* =========================================================
   СЬОГОДНІ
========================================================= */

function goToday() {

    const today =
        new Date();

    today.setHours(
        0, 0, 0, 0
    );

    currentDate =
        today;

    currentWeekStart =
        getMonday(
            today
        );

    render();
}


/* =========================================================
   НАЗВА ПЕРІОДУ
========================================================= */

function updatePeriodLabel() {

    const label =
        document.getElementById(
            "periodLabel"
        );

    if (
        mode === "week"
    ) {

        const start =
            currentWeekStart;

        const end =
            addDays(
                start,
                5
            );

        label.textContent =
            `${formatShortDate(start)} – ${formatShortDate(end)}`;

    } else {

        label.textContent =
            formatDate(
                currentDate
            );
    }
}


/* =========================================================
   НАЗВИ ДНІВ
========================================================= */

const DAY_NAMES = [
    "Неділя",
    "Понеділок",
    "Вівторок",
    "Середа",
    "Четвер",
    "П'ятниця",
    "Субота"
];


const DAY_ICONS = [
    "🌙",
    "📘",
    "📗",
    "📙",
    "📕",
    "📒",
    "📓"
];


/* =========================================================
   ПРОВЕДЕНО
========================================================= */

function isConducted(item) {

    return (
        item.conducted === true ||
        item.conducted === 1 ||
        item.conducted === "1" ||
        item.conducted === "true"
    );
}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =========================================================
   ОДНЕ ЗАНЯТТЯ
========================================================= */

function lessonRow(item) {

    const number =
        item.lesson ??
        "";

    const group =
        item.group ??
        "";

    const subject =
        item.subject ??
        "Без назви";

    const time =
        item.time ??
        "";

    const conducted =
        isConducted(item);

    return `

        <div class="lesson">

            <div class="lesson-number">
                ${escapeHTML(number)}
            </div>

            <div class="lesson-main">

                <div class="lesson-subject">
                    ${escapeHTML(subject)}
                </div>

                <div class="lesson-meta">

                    ${
                        group
                        ? `
                            <span class="group">
                                👥 ${escapeHTML(group)}
                            </span>
                          `
                        : ""
                    }

                    ${
                        time
                        ? `
                            <span class="time">
                                🕐 ${escapeHTML(time)}
                            </span>
                          `
                        : ""
                    }

                </div>

            </div>

            ${
                conducted
                ? `
                    <div
                        class="conducted"
                        title="Заняття проведено"
                    >
                        ✓
                    </div>
                  `
                : ""
            }

        </div>

    `;
}


/* =========================================================
   ДЕНЬ
========================================================= */

function renderDay(date) {

    const lessons =
        getLessonsForDate(
            date
        );

    const today =
        toISO(date) ===
        toISO(new Date());

    const dayIndex =
        date.getDay();

    const dayName =
        DAY_NAMES[dayIndex];

    const icon =
        DAY_ICONS[dayIndex];

    let html = `

        <section class="day-card">

            <div class="day-header">

                <div class="day-title">

                    <div class="day-icon">
                        ${icon}
                    </div>

                    <div>

                        <div class="day-name">
                            ${dayName}
                        </div>

                        <div class="day-date">
                            ${formatDate(date)}
                        </div>

                    </div>

                </div>

                ${
                    today
                    ? `
                        <div class="current-day">
                            СЬОГОДНІ
                        </div>
                      `
                    : ""
                }

            </div>

            <div class="lessons">
    `;


    if (
        lessons.length === 0
    ) {

        html += `

            <div class="empty">

                <span class="empty-icon">
                    ☕
                </span>

                Занять немає

            </div>

        `;

    } else {

        lessons.forEach(
            item => {

                html +=
                    lessonRow(item);

            }
        );
    }


    html += `

            </div>

        </section>

    `;

    return html;
}


/* =========================================================
   ТИЖДЕНЬ
========================================================= */

function renderWeek() {

    let html = "";

    const weekType =
        getWeekTypeForWeek(
            currentWeekStart
        );

    document.getElementById(
        "weekInfo"
    ).innerHTML =
        weekBadge(
            weekType
        );


    /*
       Понеділок - субота
    */

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        const date =
            addDays(
                currentWeekStart,
                i
            );

        html +=
            renderDay(
                date
            );
    }

    return html;
}


/* =========================================================
   ОДИН ДЕНЬ
========================================================= */

function renderSingleDay() {

    const weekType =
        getWeekTypeForWeek(
            getMonday(
                currentDate
            )
        );

    document.getElementById(
        "weekInfo"
    ).innerHTML =
        weekBadge(
            weekType
        );

    return renderDay(
        currentDate
    );
}


/* =========================================================
   RENDER
========================================================= */

function render() {

    updateTodayLine();

    updatePeriodLabel();


    if (
        mode === "week"
    ) {

        document.getElementById(
            "content"
        ).innerHTML =
            renderWeek();

    } else {

        document.getElementById(
            "content"
        ).innerHTML =
            renderSingleDay();
    }
}


/* =========================================================
   СТАРТ
========================================================= */

updateTodayLine();

loadSchedule();

</script>

</body>
</html>
