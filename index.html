<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Розклад занять</title>

<style>
    :root {
        --bg: #0b1120;
        --bg2: #111827;
        --surface: #151e2e;
        --surface2: #1b2638;
        --surface3: #202d42;

        --border: rgba(255,255,255,.08);

        --text: #f1f5f9;
        --text2: #cbd5e1;
        --muted: #94a3b8;

        --accent: #3b82f6;
        --accent2: #2563eb;

        --numerator: #60a5fa;
        --denominator: #fbbf24;

        --green: #22c55e;
        --green-bg: rgba(34,197,94,.13);

        --shadow: 0 12px 30px rgba(0,0,0,.28);
    }

    * {
        box-sizing: border-box;
    }

    html {
        background: var(--bg);
    }

    body {
        margin: 0;
        min-height: 100vh;

        font-family:
            Inter,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Arial,
            sans-serif;

        color: var(--text);

        background:
            radial-gradient(
                circle at 50% -10%,
                rgba(37,99,235,.22),
                transparent 38%
            ),
            linear-gradient(
                180deg,
                #0b1120 0%,
                #0f172a 45%,
                #0b1120 100%
            );
    }

    button {
        font: inherit;
    }

    .app {
        width: 100%;
        max-width: 850px;
        margin: 0 auto;
        padding: 16px 14px 40px;
    }

    /* =========================
       HEADER
    ========================= */

    header {
        padding: 8px 2px 18px;
    }

    .header-top {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .logo {
        width: 48px;
        height: 48px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 15px;

        background:
            linear-gradient(
                145deg,
                #3b82f6,
                #1d4ed8
            );

        box-shadow:
            0 8px 22px rgba(37,99,235,.32);

        font-size: 25px;
    }

    .title-box {
        flex: 1;
    }

    h1 {
        margin: 0;

        font-size: 25px;
        line-height: 1.15;
        font-weight: 750;

        letter-spacing: -.5px;
    }

    .today-line {
        margin-top: 5px;

        color: var(--muted);
        font-size: 14px;
    }

    /* =========================
       TABS
    ========================= */

    .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;

        padding: 4px;

        background: rgba(255,255,255,.055);
        border: 1px solid var(--border);

        border-radius: 14px;

        margin-bottom: 12px;
    }

    .tab {
        border: 0;
        background: transparent;

        color: var(--muted);

        padding: 11px 12px;

        border-radius: 10px;

        cursor: pointer;

        font-size: 14px;
        font-weight: 650;

        transition:
            background .18s ease,
            color .18s ease,
            transform .12s ease;
    }

    .tab:active {
        transform: scale(.98);
    }

    .tab.active {
        color: white;

        background:
            linear-gradient(
                135deg,
                rgba(59,130,246,.95),
                rgba(37,99,235,.95)
            );

        box-shadow:
            0 5px 16px rgba(37,99,235,.25);
    }

    /* =========================
       NAVIGATION
    ========================= */

    .navigation {
        display: grid;
        grid-template-columns: 48px 1fr 48px;
        gap: 9px;

        align-items: center;

        margin-bottom: 10px;
    }

    .nav-btn {
        height: 46px;

        border: 1px solid var(--border);
        border-radius: 13px;

        background: var(--surface);

        color: var(--text);

        cursor: pointer;

        font-size: 20px;

        box-shadow: 0 5px 15px rgba(0,0,0,.16);

        transition:
            background .18s ease,
            transform .12s ease;
    }

    .nav-btn:hover {
        background: var(--surface2);
    }

    .nav-btn:active {
        transform: scale(.94);
    }

    .period-label {
        min-width: 0;

        height: 46px;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 0 10px;

        border: 1px solid var(--border);
        border-radius: 13px;

        background:
            linear-gradient(
                135deg,
                rgba(255,255,255,.065),
                rgba(255,255,255,.035)
            );

        color: var(--text);

        font-size: 15px;
        font-weight: 700;

        text-align: center;
    }

    /* =========================
       TODAY BUTTON
    ========================= */

    .today-btn {
        width: 100%;

        border: 1px solid rgba(59,130,246,.28);
        border-radius: 13px;

        background:
            linear-gradient(
                135deg,
                rgba(59,130,246,.16),
                rgba(37,99,235,.08)
            );

        color: #93c5fd;

        padding: 12px;

        cursor: pointer;

        font-size: 14px;
        font-weight: 700;

        margin-bottom: 16px;

        transition:
            background .18s ease,
            transform .12s ease;
    }

    .today-btn:hover {
        background:
            linear-gradient(
                135deg,
                rgba(59,130,246,.25),
                rgba(37,99,235,.13)
            );
    }

    .today-btn:active {
        transform: scale(.985);
    }

    /* =========================
       WEEK BADGE
    ========================= */

    .week-info {
        display: flex;
        align-items: center;
        justify-content: center;

        margin-bottom: 14px;
    }

    .week-badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;

        padding: 7px 13px;

        border-radius: 999px;

        font-size: 13px;
        font-weight: 700;

        border: 1px solid var(--border);
    }

    .week-badge.numerator {
        color: var(--numerator);

        background: rgba(59,130,246,.11);
        border-color: rgba(59,130,246,.18);
    }

    .week-badge.denominator {
        color: var(--denominator);

        background: rgba(251,191,36,.09);
        border-color: rgba(251,191,36,.17);
    }

    /* =========================
       DAY CARD
    ========================= */

    .day-card {
        margin-bottom: 14px;

        border: 1px solid var(--border);
        border-radius: 18px;

        overflow: hidden;

        background:
            linear-gradient(
                145deg,
                rgba(21,30,46,.98),
                rgba(17,24,39,.98)
            );

        box-shadow: var(--shadow);
    }

    .day-header {
        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 10px;

        padding: 14px 15px;

        background: rgba(255,255,255,.025);

        border-bottom: 1px solid var(--border);
    }

    .day-title {
        display: flex;
        align-items: center;
        gap: 9px;

        min-width: 0;
    }

    .day-icon {
        width: 34px;
        height: 34px;

        display: flex;
        align-items: center;
        justify-content: center;

        flex-shrink: 0;

        border-radius: 10px;

        background: rgba(59,130,246,.12);

        color: #60a5fa;

        font-size: 17px;
    }

    .day-name {
        font-size: 16px;
        font-weight: 750;
    }

    .day-date {
        margin-top: 2px;

        color: var(--muted);

        font-size: 12px;
    }

    .current-day {
        color: #60a5fa;

        font-size: 11px;
        font-weight: 750;

        white-space: nowrap;
    }

    /* =========================
       LESSON
    ========================= */

    .lessons {
        padding: 7px;
    }

    .lesson {
        position: relative;

        display: grid;
        grid-template-columns: 42px 1fr auto;

        gap: 10px;

        align-items: center;

        padding: 12px 9px;

        border-radius: 13px;

        transition: background .15s ease;
    }

    .lesson + .lesson {
        margin-top: 2px;
    }

    .lesson:hover {
        background: rgba(255,255,255,.035);
    }

    .lesson-number {
        width: 34px;
        height: 34px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 10px;

        background: rgba(255,255,255,.055);

        color: var(--muted);

        font-size: 13px;
        font-weight: 750;
    }

    .lesson-main {
        min-width: 0;
    }

    .lesson-subject {
        color: var(--text);

        font-size: 15px;
        line-height: 1.3;

        font-weight: 700;

        overflow-wrap: anywhere;
    }

    .lesson-meta {
        display: flex;
        flex-wrap: wrap;

        gap: 5px 8px;

        margin-top: 5px;

        color: var(--muted);

        font-size: 12px;
    }

    .group {
        color: #a5b4fc;
    }

    .time {
        color: #94a3b8;
    }

    /* =========================
       CONDUCTED
    ========================= */

    .conducted {
        width: 30px;
        height: 30px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: var(--green-bg);

        border: 1px solid rgba(34,197,94,.2);

        color: var(--green);

        font-size: 16px;
        font-weight: 800;

        flex-shrink: 0;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
        padding: 25px 16px;

        text-align: center;

        color: var(--muted);

        font-size: 14px;
    }

    .empty-icon {
        display: block;

        margin-bottom: 7px;

        font-size: 27px;
        opacity: .7;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
        text-align: center;

        padding: 15px 5px 0;

        color: #64748b;

        font-size: 11px;
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 700px) {
        .app {
            padding: 30px 20px 50px;
        }

        h1 {
            font-size: 28px;
        }

        .day-card {
            border-radius: 20px;
        }

        .lesson {
            padding: 13px 12px;
        }
    }

    /* =========================
       SMALL PHONES
    ========================= */

    @media (max-width: 380px) {
        .app {
            padding-left: 10px;
            padding-right: 10px;
        }

        h1 {
            font-size: 22px;
        }

        .logo {
            width: 44px;
            height: 44px;
        }

        .lesson {
            grid-template-columns: 36px 1fr auto;
            gap: 8px;
        }

        .lesson-number {
            width: 31px;
            height: 31px;
        }

        .lesson-subject {
            font-size: 14px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header>
        <div class="header-top">

            <div class="logo">
                📚
            </div>

            <div class="title-box">
                <h1>Розклад занять</h1>

                <div class="today-line" id="todayLine">
                    Завантаження...
                </div>
            </div>

        </div>
    </header>


    <!-- TABS -->
    <div class="tabs">

        <button
            class="tab active"
            id="weekTab"
            onclick="setMode('week')"
        >
            📅 Тиждень
        </button>

        <button
            class="tab"
            id="dayTab"
            onclick="setMode('day')"
        >
            📋 День
        </button>

    </div>


    <!-- NAVIGATION -->
    <div class="navigation">

        <button
            class="nav-btn"
            onclick="previousPeriod()"
            aria-label="Попередній"
        >
            ‹
        </button>

        <div
            class="period-label"
            id="periodLabel"
        >
            Завантаження...
        </div>

        <button
            class="nav-btn"
            onclick="nextPeriod()"
            aria-label="Наступний"
        >
            ›
        </button>

    </div>


    <!-- TODAY -->
    <button
        class="today-btn"
        onclick="goToday()"
    >
        📍 Показати сьогодні
    </button>


    <!-- WEEK INFO -->
    <div
        class="week-info"
        id="weekInfo"
    ></div>


    <!-- CONTENT -->
    <main id="content">

        <div class="empty">
            <span class="empty-icon">⏳</span>
            Завантаження розкладу...
        </div>

    </main>


    <div class="footer">
        Розклад занять • Оновлюється автоматично
    </div>

</div>


<script>

let schedule = [];

let mode = "week";

let currentDate = new Date();

let currentWeekStart = getMonday(currentDate);


/* =========================================================
   LOAD SCHEDULE
========================================================= */

async function loadSchedule() {

    try {

        const response = await fetch(
            "schedule.json?_=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("Не вдалося завантажити schedule.json");
        }

        schedule = await response.json();

        render();

    } catch (error) {

        console.error(error);

        document.getElementById("content").innerHTML = `
            <div class="empty">
                <span class="empty-icon">⚠️</span>
                Не вдалося завантажити розклад
            </div>
        `;
    }
}


/* =========================================================
   DATE HELPERS
========================================================= */

function toISO(date) {

    const y = date.getFullYear();

    const m = String(date.getMonth() + 1).padStart(2, "0");

    const d = String(date.getDate()).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


function parseISO(iso) {

    const [y, m, d] = iso.split("-").map(Number);

    return new Date(y, m - 1, d);
}


function getMonday(date) {

    const d = new Date(date);

    const day = d.getDay();

    const diff = day === 0 ? -6 : 1 - day;

    d.setDate(d.getDate() + diff);

    d.setHours(0, 0, 0, 0);

    return d;
}


function addDays(date, amount) {

    const d = new Date(date);

    d.setDate(d.getDate() + amount);

    return d;
}


function formatDate(date) {

    return date.toLocaleDateString(
        "uk-UA",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );
}


function formatShortDate(date) {

    return date.toLocaleDateString(
        "uk-UA",
        {
            day: "2-digit",
            month: "2-digit"
        }
    );
}


/* =========================================================
   TODAY
========================================================= */

function updateTodayLine() {

    const now = new Date();

    const text = now.toLocaleDateString(
        "uk-UA",
        {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

    document.getElementById("todayLine").textContent =
        text.charAt(0).toUpperCase() + text.slice(1);
}


/* =========================================================
   WEEK TYPE
========================================================= */

function getWeekInfoForDate(date) {

    const iso = toISO(date);

    const item = schedule.find(
        x => x.date === iso
    );

    if (item) {

        const value =
            String(
                item.week_type ||
                item.weekType ||
                item.type ||
                ""
            ).toLowerCase();

        if (
            value.includes("чис") ||
            value.includes("num")
        ) {
            return "numerator";
        }

        if (
            value.includes("знам") ||
            value.includes("den")
        ) {
            return "denominator";
        }
    }

    return null;
}


function weekBadge(type) {

    if (type === "numerator") {

        return `
            <div class="week-badge numerator">
                🔵 Чисельник
            </div>
        `;
    }

    if (type === "denominator") {

        return `
            <div class="week-badge denominator">
                🟡 Знаменник
            </div>
        `;
    }

    return "";
}


/* =========================================================
   MODE
========================================================= */

function setMode(newMode) {

    mode = newMode;

    document
        .getElementById("weekTab")
        .classList.toggle(
            "active",
            mode === "week"
        );

    document
        .getElementById("dayTab")
        .classList.toggle(
            "active",
            mode === "day"
        );

    render();
}


/* =========================================================
   NAVIGATION
========================================================= */

function previousPeriod() {

    if (mode === "week") {

        currentWeekStart =
            addDays(currentWeekStart, -7);

    } else {

        currentDate =
            addDays(currentDate, -1);

        currentWeekStart =
            getMonday(currentDate);
    }

    render();
}


function nextPeriod() {

    if (mode === "week") {

        currentWeekStart =
            addDays(currentWeekStart, 7);

    } else {

        currentDate =
            addDays(currentDate, 1);

        currentWeekStart =
            getMonday(currentDate);
    }

    render();
}


/* =========================================================
   TODAY BUTTON
========================================================= */

function goToday() {

    const today = new Date();

    today.setHours(0, 0, 0, 0);

    currentDate = today;

    currentWeekStart =
        getMonday(today);

    render();
}


/* =========================================================
   PERIOD LABEL
========================================================= */

function updatePeriodLabel() {

    const label =
        document.getElementById("periodLabel");

    if (mode === "week") {

        const start = currentWeekStart;

        const end =
            addDays(start, 5);

        label.textContent =
            `${formatShortDate(start)} – ${formatShortDate(end)}`;

    } else {

        label.textContent =
            formatDate(currentDate);
    }
}


/* =========================================================
   LESSON HELPERS
========================================================= */

function getLessonsForDate(date) {

    const iso = toISO(date);

    return schedule
        .filter(item => item.date === iso)
        .sort((a, b) => {

            const la =
                Number(
                    a.lesson ??
                    a.lesson_number ??
                    a.number ??
                    0
                );

            const lb =
                Number(
                    b.lesson ??
                    b.lesson_number ??
                    b.number ??
                    0
                );

            return la - lb;
        });
}


function isConducted(item) {

    return (
        item.conducted === true ||
        item.conducted === 1 ||
        item.conducted === "1" ||
        item.conducted === "true"
    );
}


function lessonRow(item, showGroup = true) {

    const number =
        item.lesson ??
        item.lesson_number ??
        item.number ??
        "";

    const subject =
        item.subject ??
        item.name ??
        item.discipline ??
        "Без назви";

    const group =
        item.group ??
        item.group_name ??
        "";

    const time =
        item.time ??
        item.lesson_time ??
        "";

    const conducted =
        isConducted(item);

    return `
        <div class="lesson">

            <div class="lesson-number">
                ${number}
            </div>

            <div class="lesson-main">

                <div class="lesson-subject">
                    ${escapeHTML(subject)}
                </div>

                <div class="lesson-meta">

                    ${
                        showGroup && group
                        ? `
                            <span class="group">
                                👥 ${escapeHTML(group)}
                            </span>
                          `
                        : ""
                    }

                    ${
                        time
                        ? `
                            <span class="time">
                                🕐 ${escapeHTML(time)}
                            </span>
                          `
                        : ""
                    }

                </div>

            </div>

            ${
                conducted
                ? `
                    <div
                        class="conducted"
                        title="Заняття проведено"
                    >
                        ✓
                    </div>
                  `
                : ""
            }

        </div>
    `;
}


/* =========================================================
   DAY NAMES
========================================================= */

const DAY_NAMES = [
    "Неділя",
    "Понеділок",
    "Вівторок",
    "Середа",
    "Четвер",
    "П'ятниця",
    "Субота"
];


const DAY_ICONS = [
    "🌙",
    "📘",
    "📗",
    "📙",
    "📕",
    "📒",
    "📓"
];


/* =========================================================
   RENDER DAY
========================================================= */

function renderDay(date, showGroup = true) {

    const lessons =
        getLessonsForDate(date);

    const today =
        toISO(date) === toISO(new Date());

    const dayName =
        DAY_NAMES[date.getDay()];

    const icon =
        DAY_ICONS[date.getDay()];

    let html = `
        <section class="day-card">

            <div class="day-header">

                <div class="day-title">

                    <div class="day-icon">
                        ${icon}
                    </div>

                    <div>

                        <div class="day-name">
                            ${dayName}
                        </div>

                        <div class="day-date">
                            ${formatDate(date)}
                        </div>

                    </div>

                </div>

                ${
                    today
                    ? `
                        <div class="current-day">
                            СЬОГОДНІ
                        </div>
                      `
                    : ""
                }

            </div>

            <div class="lessons">
    `;

    if (lessons.length === 0) {

        html += `
            <div class="empty">
                <span class="empty-icon">☕</span>
                Занять немає
            </div>
        `;

    } else {

        lessons.forEach(item => {

            html += lessonRow(
                item,
                showGroup
            );

        });
    }

    html += `
            </div>

        </section>
    `;

    return html;
}


/* =========================================================
   RENDER WEEK
========================================================= */

function renderWeek() {

    let html = "";

    const weekType =
        getWeekInfoForDate(
            currentWeekStart
        ) ||
        getWeekInfoForDate(
            addDays(currentWeekStart, 1)
        ) ||
        getWeekInfoForDate(
            addDays(currentWeekStart, 2)
        ) ||
        getWeekInfoForDate(
            addDays(currentWeekStart, 3)
        ) ||
        getWeekInfoForDate(
            addDays(currentWeekStart, 4)
        ) ||
        getWeekInfoForDate(
            addDays(currentWeekStart, 5)
        );

    document.getElementById("weekInfo").innerHTML =
        weekBadge(weekType);

    for (let i = 0; i < 6; i++) {

        const date =
            addDays(currentWeekStart, i);

        html += renderDay(
            date,
            true
        );
    }

    return html;
}


/* =========================================================
   RENDER SINGLE DAY
========================================================= */

function renderSingleDay() {

    const weekType =
        getWeekInfoForDate(
            currentDate
        );

    document.getElementById("weekInfo").innerHTML =
        weekBadge(weekType);

    return renderDay(
        currentDate,
        true
    );
}


/* =========================================================
   MAIN RENDER
========================================================= */

function render() {

    updateTodayLine();

    updatePeriodLabel();

    if (mode === "week") {

        document.getElementById("content").innerHTML =
            renderWeek();

    } else {

        document.getElementById("content").innerHTML =
            renderSingleDay();
    }
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}
