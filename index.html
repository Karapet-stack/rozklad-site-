<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Розклад</title>
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem("theme"); } catch (e) {}
  if (t !== "dark" && t !== "light") {
    t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<style>
  :root {
    --accent: #3182ce;
    --bg: #f0f4f8;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #1a202c;
    --muted: #718096;
    --numerator: #3182ce;
    --denominator: #d69e2e;
    --accent-soft: #ebf8ff;
    --warn-soft: #fffff0;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --accent: #4299e1;
    --bg: #171923;
    --surface: #232838;
    --border: #3a4256;
    --text: #edf2f7;
    --muted: #a0aec0;
    --numerator: #63b3ed;
    --denominator: #f6ad55;
    --accent-soft: #23395b;
    --warn-soft: #4a3a1a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 14px 12px 40px;
  }
  header {
    text-align: center;
    padding: 14px 10px 12px;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 22px;
  }
  header .sub {
    font-size: 13px;
    color: var(--muted);
  }
  .badge {
    display: inline-block;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 12px;
  }
  .badge.numerator { color: var(--numerator); background: var(--accent-soft); }
  .badge.denominator { color: var(--denominator); background: var(--warn-soft); }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 12px 6px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--surface);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .nav-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .nav-btn {
    flex-shrink: 0;
    min-height: 44px;
    min-width: 44px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--surface);
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
  }
  .nav-label {
    flex: 1;
    text-align: center;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 10px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-weight: 600;
    font-size: 14px;
    padding: 0 6px;
  }
  .today-btn {
    flex-shrink: 0;
    min-height: 44px;
    padding: 0 12px;
    border-radius: 10px;
    border: 2px solid var(--accent);
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .card.today {
    border: 2px solid var(--accent);
  }
  .lesson-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .lesson-row:last-child { border-bottom: none; }
  .lesson-no {
    min-width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .lesson-info { flex: 1; min-width: 0; }
  .lesson-subject {
    font-weight: 600;
    font-size: 15px;
    overflow-wrap: anywhere;
  }
  .lesson-group {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 6px;
    padding: 1px 6px;
    margin-bottom: 2px;
  }
  .lesson-time {
    font-size: 12px;
    color: var(--muted);
  }
  .lesson-conducted {
    font-size: 16px;
  }

  .day-heading {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 18px 0 8px;
    padding-left: 2px;
    scroll-margin-top: 10px;
  }
  .day-heading:first-child { margin-top: 4px; }
  .day-heading .d-name {
    font-weight: 700;
    font-size: 15px;
  }
  .day-heading .d-date {
    font-size: 12px;
    color: var(--muted);
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 30px 10px;
    font-size: 14px;
  }

  .header-btns {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .bell-btn {
    margin-top: 10px;
    min-height: 40px;
    padding: 0 16px;
    border-radius: 20px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .bell-btn.on {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }
  .bell-hint {
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
  }

  .updated {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 Розклад</h1>
    <div class="sub" id="todayLine">Завантаження…</div>
    <div class="header-btns">
      <button class="bell-btn" id="bellBtn">🔕 Дзвінок вимкнено</button>
      <button class="bell-btn" id="themeBtn">🌙 Темна тема</button>
    </div>
    <div class="bell-hint" id="bellHint">Дзвінок працює, поки сторінка відкрита, а екран увімкнений.</div>
  </header>

  <div class="tabs">
    <div class="tab active" data-mode="week">Тиждень</div>
    <div class="tab" data-mode="day">День</div>
  </div>

  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn">‹</button>
    <div class="nav-label" id="navLabel"></div>
    <button class="nav-btn" id="nextBtn">›</button>
  </div>
  <button class="today-btn" id="todayBtn" style="width:100%; margin-bottom:14px;">📌 Сьогодні</button>

  <div id="content"></div>

  <div class="updated" id="updatedLine"></div>
</div>

<script>
let SCHEDULE = null;
let mode = "week";       // "week" | "day"
let currentDate = null;  // Date object — вибраний день (для режиму "день")
let currentWeekStart = null; // Date object — понеділок обраного тижня
let shownTodayISO = "";  // яку дату "сьогодні" зараз показано у шапці

function parseISO(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function toISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function fmtDateShort(d) {
  return `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}`;
}
function fmtDateFull(d) {
  return `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`;
}
function getMonday(d) {
  const day = d.getDay(); // 0=нд,1=пн,...6=сб
  const diff = (day === 0 ? -6 : 1) - day;
  const res = new Date(d);
  res.setDate(d.getDate() + diff);
  return res;
}
function addDays(d, n) {
  const res = new Date(d);
  res.setDate(d.getDate() + n);
  return res;
}

// СПРАВЖНЯ сьогоднішня дата пристрою (а не дата, коли згенерували schedule.json)
function realToday() {
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
function todayISO() {
  return toISO(realToday());
}

function weekBadge(label, type) {
  if (!label) return "";
  const cls = type === "numerator" ? "numerator" : "denominator";
  return `<span class="badge ${cls}">${label}</span>`;
}

// Тип тижня (чисельник/знаменник) для будь-якої дати —
// беремо з уроків, а якщо в цей день уроків нема — рахуємо за парністю тижнів.
function weekTypeFor(d) {
  if (!SCHEDULE || !SCHEDULE.lessons.length) return null;

  const iso = toISO(d);
  const same = SCHEDULE.lessons.find(l => l.date === iso);
  if (same) return { type: same.week_type, label: same.week_type_label };

  const ref = SCHEDULE.lessons[0];
  const weeks = Math.round((getMonday(d) - getMonday(parseISO(ref.date))) / (7 * 86400000));
  const flip = Math.abs(weeks) % 2 === 1;
  const refType = ref.week_type;
  const type = flip ? (refType === "numerator" ? "denominator" : "numerator") : refType;

  const labelOf = {};
  SCHEDULE.lessons.forEach(l => { labelOf[l.week_type] = l.week_type_label; });
  const label = labelOf[type] || (type === "numerator" ? "Чисельник" : "Знаменник");
  return { type, label };
}

function updateTodayLine() {
  const t = realToday();
  shownTodayISO = toISO(t);
  const wt = weekTypeFor(t);
  const badge = wt ? weekBadge(wt.label, wt.type) : "";
  document.getElementById("todayLine").innerHTML =
    `Сьогодні ${fmtDateFull(t)} · ${badge}`;
}

async function load() {
  const res = await fetch("schedule.json?_=" + Date.now());
  SCHEDULE = await res.json();

  updateTodayLine();

  const genDate = new Date(SCHEDULE.generated_at);
  document.getElementById("updatedLine").textContent =
    "Оновлено: " + genDate.toLocaleString("uk-UA");

  currentDate = realToday();
  currentWeekStart = weekStartFor(currentDate);

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      mode = tab.dataset.mode;
      render();
    });
  });

  document.getElementById("prevBtn").addEventListener("click", () => step(-1));
  document.getElementById("nextBtn").addEventListener("click", () => step(1));
  document.getElementById("todayBtn").addEventListener("click", goToday);

  render();
}

// У неділю показуємо наступний тиждень (поточний уже закінчився)
function weekStartFor(d) {
  const monday = getMonday(d);
  return d.getDay() === 0 ? addDays(monday, 7) : monday;
}

function goToday() {
  currentDate = realToday();
  currentWeekStart = weekStartFor(currentDate);
  updateTodayLine();
  render();
  setTimeout(() => {
    const el = document.getElementById("today-block");
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    else window.scrollTo({ top: 0, behavior: "smooth" });
  }, 50);
}

function step(dir) {
  if (mode === "day") {
    currentDate = addDays(currentDate, dir);
  } else {
    currentWeekStart = addDays(currentWeekStart, dir * 7);
  }
  render();
}

function lessonRow(item, showGroup) {
  const mark = item.conducted ? '<span class="lesson-conducted">✅</span>' : "";
  const groupTag = showGroup ? `<div><span class="lesson-group">${item.group}</span></div>` : "";
  return `
    <div class="lesson-row">
      <div class="lesson-no">${item.lesson}</div>
      <div class="lesson-info">
        ${groupTag}
        <div class="lesson-subject">${item.subject}</div>
        <div class="lesson-time">${item.time || ""}</div>
      </div>
      ${mark}
    </div>`;
}

function render() {
  const content = document.getElementById("content");
  const navLabel = document.getElementById("navLabel");
  const tISO = todayISO();

  if (mode === "day") {
    const iso = toISO(currentDate);
    const weekdayIdx = (currentDate.getDay() + 6) % 7; // 0=пн
    const items = SCHEDULE.lessons
      .filter(l => l.date === iso)
      .sort((a, b) => a.lesson - b.lesson);

    const wt = weekTypeFor(currentDate);
    const label = wt ? weekBadge(wt.label, wt.type) : "";
    navLabel.innerHTML = `${fmtDateFull(currentDate)} ${label}`;

    if (weekdayIdx > 5) {
      content.innerHTML = '<div class="empty">Неділя — занять немає</div>';
      return;
    }

    if (items.length === 0) {
      content.innerHTML = '<div class="empty">Немає занять цього дня</div>';
      return;
    }

    content.innerHTML =
      `<div class="card${iso === tISO ? " today" : ""}">${items.map(i => lessonRow(i, true)).join("")}</div>`;
  } else {
    const weekStart = currentWeekStart;
    const weekEnd = addDays(weekStart, 5);
    const weekItems = SCHEDULE.lessons.filter(l => {
      const d = parseISO(l.date);
      return d >= weekStart && d <= weekEnd;
    });

    const wt = weekTypeFor(weekStart);
    const label = wt ? weekBadge(wt.label, wt.type) : "";
    navLabel.innerHTML = `${fmtDateShort(weekStart)}–${fmtDateFull(weekEnd)} ${label}`;

    if (weekItems.length === 0) {
      content.innerHTML = '<div class="empty">Немає занять на цьому тижні</div>';
      return;
    }

    const byDate = {};
    const order = [];
    for (let i = 0; i < 6; i++) {
      const d = addDays(weekStart, i);
      order.push(toISO(d));
      byDate[toISO(d)] = [];
    }
    for (const item of weekItems) {
      if (byDate[item.date]) byDate[item.date].push(item);
    }

    let html = "";
    for (const iso of order) {
      const dayItems = byDate[iso].sort((a, b) => a.lesson - b.lesson);
      const d = parseISO(iso);
      const isToday = iso === tISO;
      const dwt = weekTypeFor(d);
      const badge = dwt ? weekBadge(dwt.label, dwt.type) : "";
      html += `
        <div class="day-heading"${isToday ? ' id="today-block"' : ""}>
          <span class="d-name">${isToday ? "📍 " : ""}${SCHEDULE_DAY_NAME(iso)}</span>
          <span class="d-date">${fmtDateShort(d)} ${badge}</span>
        </div>`;
      const cardCls = "card" + (isToday ? " today" : "");
      if (dayItems.length === 0) {
        html += `<div class="${cardCls}"><div class="empty" style="padding:14px;">Немає занять</div></div>`;
      } else {
        html += `<div class="${cardCls}">${dayItems.map(i => lessonRow(i, true)).join("")}</div>`;
      }
    }
    content.innerHTML = html;
  }
}

function SCHEDULE_DAY_NAME(iso) {
  const item = SCHEDULE.lessons.find(l => l.date === iso);
  if (item) return item.weekday;
  const NAMES = ["Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота"];
  const idx = (parseISO(iso).getDay() + 6) % 7;
  return NAMES[idx] || "";
}

// ===== Дзвінок на початок/кінець пар (автоматично) =====
let bellOn = false;
let audioCtx = null;
let wakeLock = null;
let lastTick = Date.now();
const rungEvents = new Set(); // позначки часу, на які вже дзвонили

function playStrike(when, vol, out) {
  // "дзвінок" = кілька затухаючих гармонік
  const freqs = [880, 1320, 1760, 2640];
  const gains = [1, 0.5, 0.35, 0.15];
  freqs.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = f;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(vol * gains[i], when + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 1.6);
    osc.connect(g).connect(out);
    osc.start(when);
    osc.stop(when + 1.7);
  });
}

function ringBell(times) {
  if (!audioCtx) return;
  if (audioCtx.state === "suspended") audioCtx.resume();
  const t0 = audioCtx.currentTime + 0.05;
  // підсилювач + компресор: гучніше, але без хрипіння/спотворень
  const master = audioCtx.createGain();
  master.gain.value = 2.2;
  const comp = audioCtx.createDynamicsCompressor();
  comp.threshold.value = -12;
  comp.knee.value = 10;
  comp.ratio.value = 12;
  comp.attack.value = 0.003;
  comp.release.value = 0.25;
  master.connect(comp).connect(audioCtx.destination);
  for (let i = 0; i < times; i++) {
    playStrike(t0 + i * 1.0, 0.5, master);
  }
}

async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator && bellOn) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) { /* не критично */ }
}

function updateBellBtn() {
  const btn = document.getElementById("bellBtn");
  btn.classList.toggle("on", bellOn);
  btn.textContent = bellOn ? "🔔 Дзвінок увімкнено" : "🔕 Дзвінок вимкнено";
}

function toggleBell() {
  bellOn = !bellOn;
  if (bellOn) {
    // AudioContext можна створювати лише після дотику користувача
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    ringBell(1); // пробний дзвінок
    lastTick = Date.now();
    requestWakeLock();
  } else if (wakeLock) {
    try { wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }
  updateBellBtn();
}

// Усі моменти дзвінка на вказану дату: час -> кількість ударів
// (початок пари = 1 удар, кінець = 2). Однакові моменти різних груп зливаються в один.
function bellEventsFor(date) {
  const events = new Map();
  const iso = toISO(date);
  const y = date.getFullYear(), mo = date.getMonth(), d = date.getDate();

  function add(hm, strikes) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(hm);
    if (!m) return;
    const ts = new Date(y, mo, d, Number(m[1]), Number(m[2]), 0).getTime();
    if (!events.has(ts)) events.set(ts, strikes);
  }

  for (const l of SCHEDULE.lessons) {
    if (l.date !== iso) continue;
    const parts = (l.time || "").split("–");
    if (parts.length !== 2) continue;
    add(parts[0].trim(), 1);
    add(parts[1].trim(), 2);
  }
  return events;
}

function checkBell() {
  const nowMs = Date.now();
  const from = lastTick;
  lastTick = nowMs;

  // Якщо за цей час змінилась доба — оновити "Сьогодні" в шапці
  if (SCHEDULE && toISO(new Date(nowMs)) !== shownTodayISO) {
    updateTodayLine();
    if (mode === "week" || mode === "day") render();
  }

  if (!bellOn || !SCHEDULE) return;

  // Браузер міг "присипляти" вкладку: звук відновлюємо, а пропущені
  // моменти шукаємо у вікні між попередньою перевіркою і зараз
  // (але не старіше 60 с, щоб не дзвонити "із запізненням").
  if (audioCtx && audioCtx.state !== "running") {
    audioCtx.resume().catch(() => {});
  }

  const windowStart = Math.max(from, nowMs - 60000);
  for (const [ts, strikes] of bellEventsFor(new Date(nowMs))) {
    if (ts > windowStart && ts <= nowMs && !rungEvents.has(ts)) {
      rungEvents.add(ts);
      ringBell(strikes);
    }
  }
}

document.getElementById("bellBtn").addEventListener("click", toggleBell);

// ===== Тема (світла/темна) =====
function updateThemeBtn() {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  document.getElementById("themeBtn").textContent = dark ? "☀️ Світла тема" : "🌙 Темна тема";
}
document.getElementById("themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  const next = dark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("theme", next); } catch (e) {}
  updateThemeBtn();
});
updateThemeBtn();

setInterval(checkBell, 1000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    if (bellOn) requestWakeLock();
    checkBell();
  }
});
load().catch(err => {
  document.getElementById("content").innerHTML =
    '<div class="empty">Не вдалося завантажити schedule.json</div>';
  console.error(err);
});
</script>
</body>
</html>
