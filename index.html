<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Розклад</title>
<style>
  :root {
    --accent: #3182ce;
    --bg: #f0f4f8;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #1a202c;
    --muted: #718096;
    --numerator: #3182ce;
    --denominator: #d69e2e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 14px 12px 40px;
  }
  header {
    text-align: center;
    padding: 14px 10px 12px;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 22px;
  }
  header .sub {
    font-size: 13px;
    color: var(--muted);
  }
  .badge {
    display: inline-block;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 12px;
  }
  .badge.numerator { color: var(--numerator); background: #ebf8ff; }
  .badge.denominator { color: var(--denominator); background: #fffff0; }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 12px 6px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--surface);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .nav-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .nav-btn {
    flex-shrink: 0;
    min-height: 44px;
    min-width: 44px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--surface);
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
  }
  .nav-label {
    flex: 1;
    text-align: center;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 10px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-weight: 600;
    font-size: 14px;
    padding: 0 6px;
  }
  .today-btn {
    flex-shrink: 0;
    min-height: 44px;
    padding: 0 12px;
    border-radius: 10px;
    border: 2px solid var(--accent);
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .lesson-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .lesson-row:last-child { border-bottom: none; }
  .lesson-no {
    min-width: 34px;
    height: 34px;
    border-radius: 10px;
    background: #ebf8ff;
    color: var(--accent);
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .lesson-info { flex: 1; min-width: 0; }
  .lesson-subject {
    font-weight: 600;
    font-size: 15px;
    overflow-wrap: anywhere;
  }
  .lesson-group {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: #ebf8ff;
    border-radius: 6px;
    padding: 1px 6px;
    margin-bottom: 2px;
  }
  .lesson-time {
    font-size: 12px;
    color: var(--muted);
  }
  .lesson-conducted {
    font-size: 16px;
  }

  .day-heading {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 18px 0 8px;
    padding-left: 2px;
  }
  .day-heading:first-child { margin-top: 4px; }
  .day-heading .d-name {
    font-weight: 700;
    font-size: 15px;
  }
  .day-heading .d-date {
    font-size: 12px;
    color: var(--muted);
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 30px 10px;
    font-size: 14px;
  }

  .bell-btn {
    margin-top: 10px;
    min-height: 40px;
    padding: 0 16px;
    border-radius: 20px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .bell-btn.on {
    border-color: var(--accent);
    background: #ebf8ff;
    color: var(--accent);
  }

  .updated {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 Розклад</h1>
    <div class="sub" id="todayLine">Завантаження…</div>
    <button class="bell-btn" id="bellBtn">🔕 Дзвінок вимкнено</button>
  </header>

  <div class="tabs">
    <div class="tab active" data-mode="week">Тиждень</div>
    <div class="tab" data-mode="day">День</div>
  </div>

  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn">‹</button>
    <div class="nav-label" id="navLabel"></div>
    <button class="nav-btn" id="nextBtn">›</button>
  </div>
  <button class="today-btn" id="todayBtn" style="width:100%; margin-bottom:14px;">📌 Сьогодні</button>

  <div id="content"></div>

  <div class="updated" id="updatedLine"></div>
</div>

<script>
let SCHEDULE = null;
let mode = "week";       // "week" | "day"
let currentDate = null;  // Date object — вибраний день (для режиму "день")
let currentWeekStart = null; // Date object — понеділок обраного тижня

function parseISO(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function toISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function fmtDateShort(d) {
  return `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}`;
}
function fmtDateFull(d) {
  return `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`;
}
function getMonday(d) {
  const day = d.getDay(); // 0=нд,1=пн,...6=сб
  const diff = (day === 0 ? -6 : 1) - day;
  const res = new Date(d);
  res.setDate(d.getDate() + diff);
  return res;
}
function addDays(d, n) {
  const res = new Date(d);
  res.setDate(d.getDate() + n);
  return res;
}

function weekBadge(label, type) {
  if (!label) return "";
  const cls = type === "numerator" ? "numerator" : "denominator";
  return `<span class="badge ${cls}">${label}</span>`;
}

async function load() {
  const res = await fetch("schedule.json?_=" + Date.now());
  SCHEDULE = await res.json();

  document.getElementById("todayLine").innerHTML =
    `Сьогодні ${fmtDateFull(parseISO(SCHEDULE.today))} · ${weekBadge(SCHEDULE.today_week_label, SCHEDULE.today_week_type)}`;

  const genDate = new Date(SCHEDULE.generated_at);
  document.getElementById("updatedLine").textContent =
    "Оновлено: " + genDate.toLocaleString("uk-UA");

  currentDate = parseISO(SCHEDULE.today);
  currentWeekStart = getMonday(currentDate);

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      mode = tab.dataset.mode;
      render();
    });
  });

  document.getElementById("prevBtn").addEventListener("click", () => step(-1));
  document.getElementById("nextBtn").addEventListener("click", () => step(1));
  document.getElementById("todayBtn").addEventListener("click", () => {
    currentDate = parseISO(SCHEDULE.today);
    currentWeekStart = getMonday(currentDate);
    render();
  });

  render();
}

function step(dir) {
  if (mode === "day") {
    currentDate = addDays(currentDate, dir);
  } else {
    currentWeekStart = addDays(currentWeekStart, dir * 7);
  }
  render();
}

function lessonRow(item, showGroup) {
  const mark = item.conducted ? '<span class="lesson-conducted">✅</span>' : "";
  const groupTag = showGroup ? `<div><span class="lesson-group">${item.group}</span></div>` : "";
  return `
    <div class="lesson-row">
      <div class="lesson-no">${item.lesson}</div>
      <div class="lesson-info">
        ${groupTag}
        <div class="lesson-subject">${item.subject}</div>
        <div class="lesson-time">${item.time || ""}</div>
      </div>
      ${mark}
    </div>`;
}

function render() {
  const content = document.getElementById("content");
  const navLabel = document.getElementById("navLabel");

  if (mode === "day") {
    const iso = toISO(currentDate);
    const weekdayIdx = (currentDate.getDay() + 6) % 7; // 0=пн
    const items = SCHEDULE.lessons
      .filter(l => l.date === iso)
      .sort((a, b) => a.lesson - b.lesson);

    const label = items.length
      ? weekBadge(items[0].week_type_label, items[0].week_type)
      : "";
    navLabel.innerHTML = `${fmtDateFull(currentDate)} ${label}`;

    if (weekdayIdx > 5) {
      content.innerHTML = '<div class="empty">Неділя — занять немає</div>';
      return;
    }

    if (items.length === 0) {
      content.innerHTML = '<div class="empty">Немає занять цього дня</div>';
      return;
    }

    content.innerHTML = `<div class="card">${items.map(i => lessonRow(i, true)).join("")}</div>`;
  } else {
    const weekStart = currentWeekStart;
    const weekEnd = addDays(weekStart, 5);
    const weekItems = SCHEDULE.lessons.filter(l => {
      const d = parseISO(l.date);
      return d >= weekStart && d <= weekEnd;
    });

    const label = weekItems.length
      ? weekBadge(weekItems[0].week_type_label, weekItems[0].week_type)
      : "";
    navLabel.innerHTML = `${fmtDateShort(weekStart)}–${fmtDateFull(weekEnd)} ${label}`;

    if (weekItems.length === 0) {
      content.innerHTML = '<div class="empty">Немає занять на цьому тижні</div>';
      return;
    }

    const byDate = {};
    const order = [];
    for (let i = 0; i < 6; i++) {
      const d = addDays(weekStart, i);
      order.push(toISO(d));
      byDate[toISO(d)] = [];
    }
    for (const item of weekItems) {
      if (byDate[item.date]) byDate[item.date].push(item);
    }

    let html = "";
    for (const iso of order) {
      const dayItems = byDate[iso].sort((a, b) => a.lesson - b.lesson);
      const d = parseISO(iso);
      const isToday = iso === SCHEDULE.today;
      const badge = dayItems.length ? weekBadge(dayItems[0].week_type_label, dayItems[0].week_type) : "";
      html += `
        <div class="day-heading">
          <span class="d-name">${isToday ? "📍 " : ""}${SCHEDULE_DAY_NAME(iso)}</span>
          <span class="d-date">${fmtDateShort(d)} ${badge}</span>
        </div>`;
      if (dayItems.length === 0) {
        html += `<div class="card"><div class="empty" style="padding:14px;">Немає занять</div></div>`;
      } else {
        html += `<div class="card">${dayItems.map(i => lessonRow(i, true)).join("")}</div>`;
      }
    }
    content.innerHTML = html;
  }
}

function SCHEDULE_DAY_NAME(iso) {
  const item = SCHEDULE.lessons.find(l => l.date === iso);
  if (item) return item.weekday;
  const NAMES = ["Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота"];
  const idx = (parseISO(iso).getDay() + 6) % 7;
  return NAMES[idx] || "";
}

// ===== Дзвінок на початок/кінець пар =====
let bellOn = false;
let audioCtx = null;
let lastRung = "";
let wakeLock = null;

function playStrike(when, vol) {
  // "дзвінок" = кілька затухаючих гармонік
  const freqs = [880, 1320, 1760, 2640];
  const gains = [1, 0.5, 0.35, 0.15];
  freqs.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = f;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(vol * gains[i], when + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 1.6);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(when);
    osc.stop(when + 1.7);
  });
}

function ringBell(times) {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + 0.05;
  for (let i = 0; i < times; i++) {
    playStrike(t0 + i * 1.0, 0.25);
  }
}

async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator && bellOn) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) { /* не критично */ }
}

function updateBellBtn() {
  const btn = document.getElementById("bellBtn");
  btn.classList.toggle("on", bellOn);
  btn.textContent = bellOn ? "🔔 Дзвінок увімкнено" : "🔕 Дзвінок вимкнено";
}

function toggleBell() {
  bellOn = !bellOn;
  if (bellOn) {
    // AudioContext можна створювати лише після дотику користувача
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    ringBell(1); // пробний дзвінок
    requestWakeLock();
  } else if (wakeLock) {
    try { wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }
  updateBellBtn();
}

function checkBell() {
  if (!bellOn || !SCHEDULE) return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const hm = `${hh}:${mm}`;
  const key = `${toISO(now)} ${hm}`;
  if (key === lastRung) return;

  const todays = SCHEDULE.lessons.filter(l => l.date === toISO(now));
  for (const l of todays) {
    const parts = (l.time || "").split("–");
    if (parts.length !== 2) continue;
    const start = parts[0].trim().padStart(5, "0");
    const end = parts[1].trim().padStart(5, "0");
    if (hm === start) { lastRung = key; ringBell(1); return; }   // початок — 1 удар
    if (hm === end)   { lastRung = key; ringBell(2); return; }   // кінець — 2 удари
  }
}

document.getElementById("bellBtn").addEventListener("click", toggleBell);
setInterval(checkBell, 1000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && bellOn) requestWakeLock();
});
load().catch(err => {
  document.getElementById("content").innerHTML =
    '<div class="empty">Не вдалося завантажити schedule.json</div>';
  console.error(err);
});
</script>
</body>
</html>
